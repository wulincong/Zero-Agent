# ==========================================================================
# Zero-Agent 配置文件
# --------------------------------------------------------------------------
# 本文件集中存放所有"可调参数"。修改后重启进程生效（部分参数支持热重载）。
# 优先级：环境变量 > 本文件 > 代码内置默认值
#   —— 即：想临时覆盖某项时，用环境变量即可，无需改本文件。
# 密钥（API Key）不放在这里，仍由 .env 管理，避免误提交到 git。
# ==========================================================================

[model]
# 默认模型档案名（对应 models/llm.py 中 MODEL_PROFILES 的键）
# 若 .agent_state.json 记录了上次选择，则优先使用上次选择。
default_profile = "deepseek"
# 采样温度
temperature = 0
# 单次请求的 socket 超时（秒）
timeout = 120.0
# 失败自动重试次数（1 表示不重试）
max_retries = 1

[timeout]
# 首字节超时（秒）：连接建立后多久没收到任何数据就判定为挂起。0 表示不限制。
first_byte = 60
# 整体超时（秒）：单次模型调用的最长等待时间，兜底防止无限等待。0 表示不限制。
total = 300

[context]
# 上下文预算（字符数，粗略按 1 token ≈ 2 字符估算）。
# 超过该值从最旧处成组丢弃消息，防止撑爆模型上下文窗口。0 表示不限制。
max_chars = 400000
# 触发压缩后至少保留的最近消息条数
keep_recent = 12

[cli]
# Markdown 渲染宽度上限（列）。0 表示不限制（用终端全宽）。
render_width = 100

[shell]
# 单条 shell 命令的默认超时（秒）
timeout = 180
